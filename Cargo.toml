[package]
name = "aloha"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["Anbang Wen <anbang@cloudflare.com>"]
description = "Low-level Rust implementation of Oblivious HTTP"
repository = "https://github.com/cloudflare/aloha-rs/"
keywords = ["ohttp", "bhttp", "privacy", "oblivious"]
categories = ["network-programming", "cryptography"]
include = ["/src", "README.md", "LICENSE"]

[dependencies]
aead = "0.6"
bytes = "1.0"
hybrid-array = "0.4"
hkdf = "0.13"
hpke = { version = "0.15", features = [ "aes", "nistp", "x25519", "chacha", "alloc" ], default-features = false }
rand = { version = "0.10", features = [ "std_rng" ], default-features = false }
sha2 = "0.11"
thiserror = "1.0"

[dev-dependencies]
hex-literal = "0.3"
rand = { version = "0.10", features = [ "std_rng" ] }
rstest = "0.16"
x25519-dalek = "2"
